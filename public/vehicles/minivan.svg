<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 140" width="260" height="140" role="img" aria-label="Shared-taxi minivan">
  <!-- Minivan: mid-size, slightly rounder + shorter than Hiace, sliding-door panel break. Body: muted orange. Accent: Twendex orange. -->
  <!-- body -->
  <path d="M34 48
           Q34 40 46 38
           L176 34
           Q206 34 224 54
           L232 66
           Q236 72 236 82
           L236 92
           Q236 100 226 100
           L40 100
           Q34 100 34 92
           Z" fill="#e8853a"/>
  <!-- windows (orange-tinted, slightly darker for contrast on orange body) -->
  <path d="M52 44 L176 41 Q198 41 210 56 L214 62 L52 62 Z" fill="#ffb877" opacity="0.95"/>
  <!-- window pillar -->
  <rect x="118" y="42" width="4" height="20" fill="#e8853a"/>
  <!-- sliding-door panel break -->
  <rect x="120" y="64" width="3" height="30" fill="#c96a24"/>
  <rect x="120" y="72" width="14" height="4" rx="2" fill="#c96a24"/>
  <!-- Twendex accent stripe -->
  <rect x="34" y="86" width="202" height="5" fill="#ff7a1a"/>
  <!-- wheels -->
  <circle cx="82" cy="100" r="20" fill="#2b3742"/>
  <circle cx="82" cy="100" r="8" fill="#e8853a"/>
  <circle cx="196" cy="100" r="20" fill="#2b3742"/>
  <circle cx="196" cy="100" r="8" fill="#e8853a"/>
</svg>
